# Site-agent turn runtime (docs/site-agent.md, #487): runs governed by
# sekai-chisei, and reaches the site only through the governed MCP gateway. The
# worker claims turns; each turn acts as its instance through the turn's
# runtime token. The `site-agent` profile refuses direct MCP
# servers, shell, write and filesystem tools, and a static bearer.
#
# Claim those turns with `shikigami --config examples/site-agent-turn.toml serve
# --intake agent-turn`. See docs/site-agent.md.
version = 1

[profile]
name = "site-agent"

[governance]
# The profile selects `sekai-chisei` and fail_closed.
# The worker's registered service principal, never an instance's principal.
principal = "svc:site-turn-worker"
namespace = "site"
# The worker principal's secret, never a static bearer.
client_secret_env = "SHIKIGAMI_CLIENT_SECRET"

[workspace]
adapter = "directory"
root = "."

[tools]
# Only the gateway's tools and the terminal report or escalation. Name each
# gateway tool the turn may call; the definition's tools can only narrow it.
# The turn's runtime token admits Action submission, not object or receipt
# reads (docs/site-agent.md).
enabled = [
  "report",
  "escalate",
  "mcp.gateway.sekai.actions.submit",
]

[tools.mcp_gateway]
url = "https://gateway.invalid/mcp"
timeout_secs = 30

[events]
adapter = "jsonl"
