# Ungoverned HTTP model through a local OpenAI-compatible gateway.
# CLIProxyAPI's default listen is http://127.0.0.1:8317/v1.
# `api_key_env` names the gateway access key (access.api-keys), not an
# upstream provider token. Do not put the key in this file.
#
#   export CLIPROXY_API_KEY="…"
#   cargo run --bin shikigami -- --config examples/cliproxy-http.toml doctor
#   cargo run --bin shikigami -- --config examples/cliproxy-http.toml tui
#
# `model` must be an id the gateway lists on GET /v1/models. Direct HTTP
# `auto` still maps to gpt-4.1-mini; set an explicit id.
#
# For TUI over a project tree, set workspace.adapter = "inplace".
# The CLI default state root is already outside cwd.
version = 1

[profile]
name = "local"

[governance]
adapter = "local"
fail_closed = false

[workspace]
adapter = "directory"
root = "."

[network]
egress = "allowlist"
allow_hosts = ["127.0.0.1"]

[tools]
mode = "workspace"
bash_timeout_secs = 60

[run]
max_turns = 20

[events]
adapter = "stderr"

[model]
adapter = "http"
base_url = "http://127.0.0.1:8317/v1"
model = "grok-4.6"
api_key_env = "CLIPROXY_API_KEY"
