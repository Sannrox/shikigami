# Primary production path: governance through sekai-chisei.
version = 1

[profile]
name = "governed"

[governance]
adapter = "sekai-chisei"
endpoint = "http://127.0.0.1:50051"
principal = "shikigami"
namespace = "default"
fail_closed = true
# token_env = "SEKAI_TOKEN"

[workspace]
adapter = "directory"
root = "."

[tools]
# Bash omitted: under profile=governed, enabling bash requires sandbox.backend=rlimit
# and network.egress=deny|allowlist (see docs/settings.md). Path jail alone does not
# contain host bash -c. Add bash only with those controls configured.
enabled = ["read_file", "write_file", "edit", "report"]
bash_timeout_secs = 60

[run]
max_turns = 50

[events]
adapter = "stderr"

[model]
adapter = "plane"
model = "auto"
