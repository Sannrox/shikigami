[workspace]
members = [
    "crates/shikigami-cli",
    "crates/shikigami-tui",
    "crates/shikigami-types",
    "crates/shikigami-plane-intake",
    "crates/shikigami-engine",
    "crates/shikigami-http",
    "crates/shikigami-governance-sekai",
]
default-members = [
    ".",
    "crates/shikigami-cli",
    "crates/shikigami-tui",
    "crates/shikigami-types",
    "crates/shikigami-plane-intake",
    "crates/shikigami-engine",
    "crates/shikigami-http",
    "crates/shikigami-governance-sekai",
]
resolver = "2"

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Sannrox/shikigami"
publish = false

[package]
name = "shikigami"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
description = "Open-source local-first headless agent harness with pluggable governance adapters."
repository.workspace = true
publish.workspace = true

[features]
default = ["governance-sekai-chisei", "model-http"]
governance-sekai-chisei = ["dep:shikigami-governance-sekai"]
model-http = ["dep:reqwest", "dep:shikigami-http", "shikigami-engine/model-http"]

[dependencies]
shikigami-engine = { path = "crates/shikigami-engine", default-features = false }
shikigami-http = { path = "crates/shikigami-http", optional = true }
shikigami-governance-sekai = { path = "crates/shikigami-governance-sekai", optional = true }
shikigami-plane-intake = { path = "crates/shikigami-plane-intake" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "process",
  "time",
  "io-util",
  "io-std",
  "fs",
  "sync",
  "signal",
  "net",
] }
uuid = { version = "1", features = ["v4"] }

# Optional: OpenAI-compatible HTTP model for local/ungoverned runs
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
url = "2.5.8"

[[test]]
name = "governed_tool_crash_recovery"
path = "tests/governed_tool_crash_recovery.rs"
harness = false

[[test]]
name = "mcp_governed_action"
path = "tests/mcp_governed_action.rs"
harness = false

[dev-dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
proptest = { version = "1", features = ["std"] }
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
