[package]
name = "shikigami"
version = "1.0.7"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
description = "Open-source local-first headless agent harness with pluggable governance adapters."
repository = "https://github.com/Sannrox/shikigami"
publish = false

[[bin]]
name = "shikigami"
path = "src/bin/shikigami.rs"

[features]
default = ["governance-sekai-chisei", "model-http"]
governance-sekai-chisei = ["dep:futures-util", "dep:sekai-client"]
model-http = ["dep:reqwest"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "io-std", "fs", "sync", "signal", "net"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
futures-util = { version = "0.3", optional = true }

# Optional: sekai-chisei Rust SDK
sekai-client = { git = "https://github.com/Sannrox/sekai-chisei.git", rev = "f6643ee1d2e539301947d1457d3ab0f22395de2f", version = "0.1.1", optional = true }

# Optional: OpenAI-compatible HTTP model for local/ungoverned runs
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
regex = "1.13.1"
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = { version = "1", features = ["std"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
