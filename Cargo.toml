[workspace]
members = [
    "crates/shikigami-cli",
    "crates/shikigami-tui",
    "crates/shikigami-types",
    "crates/shikigami-engine",
    "crates/shikigami-http",
]
default-members = [
    ".",
    "crates/shikigami-cli",
    "crates/shikigami-tui",
    "crates/shikigami-types",
    "crates/shikigami-engine",
    "crates/shikigami-http",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Sannrox/shikigami"
publish = false

[package]
name = "shikigami"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
description = "Open-source local-first headless agent harness."
repository.workspace = true
publish.workspace = true

[features]
default = ["model-http"]
model-http = ["dep:reqwest", "dep:shikigami-http", "shikigami-engine/model-http"]

[dependencies]
bytes = "1"
shikigami-engine = { path = "crates/shikigami-engine", default-features = false }
shikigami-http = { path = "crates/shikigami-http", optional = true }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "process",
  "time",
  "io-util",
  "io-std",
  "fs",
  "sync",
  "signal",
  "net",
] }
uuid = { version = "1", features = ["v4"] }

# Optional: OpenAI-compatible HTTP model for local/ungoverned runs
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
url = "2.5.8"

[dev-dependencies]
async-trait = "0.1"
libc = "0.2"
proptest = { version = "1", features = ["std"] }
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }

# Dependencies build without debug info in dev and test builds: backtraces
# and debuggers keep full detail for workspace crates, and build directories
# stay a fraction of the size.
[profile.dev.package."*"]
debug = false
