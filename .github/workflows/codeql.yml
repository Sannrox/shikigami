name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.3
        with:
          category: "/language:rust"
