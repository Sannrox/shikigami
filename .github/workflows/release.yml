name: release

# Runs from main for a signed tag. release-dispatch.yml starts it on a v* tag
# push; a failed run is fixed on main and re-run for the same tag. Without a
# tag it is a dry run: it resolves the checked-out commit and runs the OCI image
# smoke, and never touches a GitHub Release, the registry, or attestations.
# Pull requests run scripts/validate-release.sh through `make validate`.
# Assets land on a draft release that the finalize job publishes after
# attesting them.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed vX.Y.Z or vX.Y.Z-rc.N tag to release from main; empty for a dry run
        required: false
        default: ""
        type: string

# One run per tag. A second dispatch for the same tag waits for the first.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Resolves the release commit every later job checks out. A tagged run must
  # come from main: main's verify-release-tag.sh checks the signed tag against
  # the allowlist on origin/main and the tagged commit's Cargo.toml, and that
  # commit must be on main. A dry run resolves the checked-out commit.
  verify-tag:
    name: Verify signed tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Refuse a tagged run that is not from main
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == refs/heads/main ]] || { echo "tagged release runs must start from refs/heads/main, not ${WORKFLOW_REF}" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta)\.[0-9]+)?$ ]] || { echo "invalid release tag: ${TAG}" >&2; exit 1; }
      - name: Check out main's release-tag verifier
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: main-tree
      # Full history: the signer allowlist is read from origin/main.
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          path: source
          fetch-depth: 0
      # checkout may leave a lightweight ref; fetch the real tag object.
      - name: Refuse unsigned, lightweight, or mismatched tags
        if: inputs.tag != ''
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
          MAIN_TREE: ${{ github.workspace }}/main-tree
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
          sha="$(git rev-parse "${TAG}^{commit}")"
          RELEASE_TRUST_REF=origin/main bash "${MAIN_TREE}/scripts/verify-release-tag.sh" verify "$TAG" "$sha"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main || { echo "tag ${TAG} commit ${sha} is not on main" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$sha"
      - name: Refuse a published release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Only "release not found" or a draft may continue; a token that
          # cannot see drafts reports a draft as not found.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - name: Resolve release commit
        id: resolve
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

  create-release:
    name: Create draft GitHub release
    needs: verify-tag
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        shell: bash
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      # Release notes come from the matching CHANGELOG.md section. A re-run
      # resumes the draft an earlier run left, keeping its uploaded assets.
      - name: Refuse to replace a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          python3 scripts/changelog-notes.py "${TAG#v}" >"${RUNNER_TEMP}/notes.md"
          # A tag with a "-" (vX.Y.Z-rc.N) is a pre-release and never latest.
          kind=()
          if [[ "$PRERELEASE" == true ]]; then
            kind=(--prerelease --latest=false)
          fi
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo absent)"
          case "$draft" in
            true)
              # Every dispatch rebuilds every asset; drop the earlier run's
              # so finalize never attests or publishes a stale archive.
              gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
                gh release delete-asset "$TAG" "$name" --yes
              done
              gh release edit "$TAG" --title "$TAG" --notes-file "${RUNNER_TEMP}/notes.md" --draft "${kind[@]}"
              ;;
            absent)
              gh release create "$TAG" --draft --verify-tag "${kind[@]}" \
                --title "$TAG" --notes-file "${RUNNER_TEMP}/notes.md"
              ;;
            *)
              echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2
              exit 1
              ;;
          esac

  shikigami-binaries:
    name: shikigami (${{ matrix.target }})
    needs: [verify-tag, create-release]
    if: needs.verify-tag.outputs.tag != ''
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build_tool: cross
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        shell: bash
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: shikigami
          target: ${{ matrix.target }}
          ref: refs/tags/${{ needs.verify-tag.outputs.tag }}
          archive: shikigami-${{ needs.verify-tag.outputs.tag }}-${{ matrix.target }}
          checksum: sha256
          locked: true
          build-tool: ${{ matrix.build_tool || 'cargo' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  oci-smoke:
    name: OCI image smoke
    # Runs on a dry run too; only a tagged run publishes the image.
    needs: verify-tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        shell: bash
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"

      - name: Verify supported release version
        id: release
        shell: bash
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="shikigami") | .version')"
          if [[ -n "$TAG" && "$version" != "${TAG#v}" ]]; then
            echo "release tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          # Pre-releases ship binaries only; the image is published for stable
          # versions, and never from a dry run.
          publish=true
          if [[ -z "$TAG" ]]; then
            publish=false
          elif [[ "$version" == *-* ]]; then
            echo "Pre-release $version: skipping OCI publication"
            publish=false
          fi
          if [[ "$version" == *+* ]]; then
            echo "OCI publication requires a registry-safe version without build metadata (got $version)" >&2
            exit 1
          fi
          minimum="$(printf '%s\n' "$version" 1.0.5 | sort -V | head -n1)"
          if [[ "$minimum" != "1.0.5" ]]; then
            echo "OCI publication requires Shikigami 1.0.5 or newer (got $version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build linux/amd64 image for smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: shikigami:release-smoke
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ needs.verify-tag.outputs.sha }}

      - name: Run deterministic image smoke
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: bash scripts/oci-image-smoke.sh shikigami:release-smoke "$VERSION" "$SHA"

  oci-image:
    name: Publish OCI image
    needs: [verify-tag, create-release, oci-smoke]
    if: needs.verify-tag.outputs.tag != '' && needs.oci-smoke.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        shell: bash
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi

      - name: Resolve repository-scoped image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and publish digest-pinned image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.verify-tag.outputs.tag }}
            ${{ steps.image.outputs.name }}:${{ needs.oci-smoke.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-tag.outputs.sha }}
            org.opencontainers.image.version=${{ needs.oci-smoke.outputs.version }}
          build-args: |
            VERSION=${{ needs.oci-smoke.outputs.version }}
            VCS_REF=${{ needs.verify-tag.outputs.sha }}
          provenance: mode=max
          sbom: true

      - name: Record immutable image reference
        id: reference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.oci-smoke.outputs.version }}
          REVISION: ${{ needs.verify-tag.outputs.sha }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        shell: bash
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build did not return an immutable OCI digest: $DIGEST" >&2
            exit 1
          fi
          metadata_file="shikigami-${VERSION}-oci.json"
          jq -n \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg version "$VERSION" \
            --arg revision "$REVISION" \
            '{schema_version: 1, image: $image, digest: $digest, reference: ($image + "@" + $digest), version: $version, revision: $revision, architecture: "linux/amd64", provenance: "BuildKit provenance mode=max", sbom: "BuildKit SBOM attestation"}' \
            > "$metadata_file"
          gh release upload "$TAG" "$metadata_file" --clobber
          echo "image=${IMAGE}:${VERSION}=${DIGEST}" >>"$GITHUB_OUTPUT"
          {
            echo "### OCI image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Metadata, provenance, and SBOM attestations were attached to the published image."
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    name: Attest, write manifest, and publish
    needs: [verify-tag, shikigami-binaries, oci-smoke, oci-image]
    # oci-image is skipped, not failed, for a pre-release.
    if: ${{ !cancelled() && needs.verify-tag.outputs.tag != '' && needs.shikigami-binaries.result == 'success' && needs.oci-smoke.result == 'success' && (needs.oci-image.result == 'success' || (needs.oci-image.result == 'skipped' && needs.oci-smoke.outputs.publish == 'false')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.verify-tag.outputs.tag }}
      SHA: ${{ needs.verify-tag.outputs.sha }}
      PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
      - name: Require HEAD at the release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Download draft assets and write SBOM
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir dist --pattern 'shikigami-*'
          python3 scripts/release-sbom.py dist/shikigami.cdx.json
      - name: Attest provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/shikigami-v*.tar.gz
            dist/shikigami.cdx.json
      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/shikigami-v*.tar.gz
          sbom-path: dist/shikigami.cdx.json
      - name: Write release manifest
        env:
          IMAGE: ${{ needs.oci-image.outputs.image }}
          PROVENANCE: ${{ steps.provenance.outputs.attestation-url }}
          SBOM: ${{ steps.sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          # Gate flags come from the labels of every pull request squashed into
          # prev..tag, whatever branch it merged into. The baseline is the
          # nearest final (non-pre-release) ancestor tag, so a final release
          # also carries gates first seen in its release candidates.
          # Without a final tag, start at the first pull request: the commits
          # before it are the repository bootstrap and carry no labels.
          prev="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "${SHA}^" 2>/dev/null || true)"
          if [[ -z "$prev" ]]; then
            prev="$(git log --reverse --format='%H %s' "$SHA" | awk '!found && /\(#[0-9]+\)$/ { print $1; found = 1 }')^"
          fi
          subjects="$(git log --format='%h %s' "${prev}..${SHA}")"
          # Fail closed: a commit with no pull request, or any lookup error,
          # fails the step instead of dropping a gate.
          if unattributed="$(grep -vE '\(#[0-9]+\)$' <<<"$subjects")"; then
            echo "commits without a pull request reference since ${prev}:" >&2
            echo "$unattributed" >&2
            exit 1
          fi
          labels=()
          prs="$(sed -nE 's/.*\(#([0-9]+)\)$/\1/p' <<<"$subjects" | sort -un)"
          while IFS= read -r pr; do
            names="$(gh pr view "$pr" --json labels --jq '.labels[].name')"
            while IFS= read -r label; do
              if [[ -n "$label" ]]; then labels+=(--label "$label"); fi
            done <<<"$names"
          done <<<"$prs"
          image=()
          if [[ -n "$IMAGE" ]]; then image=(--image "$IMAGE"); fi
          python3 scripts/release-manifest.py \
            --version "${TAG#v}" --git-sha "$SHA" --tag "$TAG" \
            --dist dist --out dist/shikigami-release.json \
            --attestation "$PROVENANCE" --attestation "$SBOM" \
            "${image[@]}" "${labels[@]}"
      # The manifest's own provenance attestation is its signature for Tenkai.
      - name: Sign release manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/shikigami-release.json
      - name: Attach and publish
        run: |
          set -euo pipefail
          # A published release is immutable; never replace its assets.
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]]; then
            echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2
            exit 1
          fi
          gh release upload "$TAG" dist/shikigami.cdx.json dist/shikigami-release.json --clobber
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false
          fi
