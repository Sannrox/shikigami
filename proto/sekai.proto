syntax = "proto3";
package sekai;

// --- Messages ---

message Object {
  string id = 1;
  string kind = 2;
  string name = 3;
  string namespace = 4;
  string external_id = 5;
  map<string, string> properties = 6;
  int64 created = 7;
  int64 updated = 8;
}

message Link {
  string id = 1;
  string from_id = 2;
  string to_id = 3;
  string relation = 4;
  int64 created = 5;
}

message ListFilter {
  string kind = 1;
  string name = 2;
  string namespace = 3;
  repeated PropertyFilter property_filters = 4;
  int32 limit = 5;
  int32 offset = 6;
  string order_by = 7;
  bool descending = 8;
  repeated string interface_filter = 9;
}

message PropertyFilter {
  string key = 1;
  string op = 2;
  string value = 3;
}

message GraphQuery {
  string start_id = 1;
  string start_external_id = 2;
  repeated string relations = 3;
  string direction = 4;
  int32 max_depth = 5;
  repeated string kind_filter = 6;
  map<string, string> property_filter = 7;
  repeated string interface_filter = 8;
}

message GraphResult {
  repeated Object objects = 1;
  repeated Link links = 2;
}

message ObjectType {
  string kind = 1;
  string description = 2;
  repeated PropertyDef properties = 3;
  bool is_builtin = 4;
  repeated string implements = 5;
}

message PropertyDef {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  repeated string enum_values = 5;
  string link_kind = 6;
  string compute_expr = 7;
  string classification = 8;
  repeated StructFieldDef struct_fields = 9;
}

message StructFieldDef {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  repeated string enum_values = 5;
}

// Ontology layer (issue #141): first-class semantic concepts above the graph.
message OntologyProperty {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
}

message Cardinality {
  uint32 min = 1;
  optional uint32 max = 2;
}

message OntologyClass {
  string name = 1;
  string description = 2;
  repeated string superclasses = 3;
  repeated string equivalent_classes = 4;
  repeated string disjoint_classes = 5;
  repeated OntologyProperty properties = 6;
  bool is_builtin = 7;
  string mapped_kind = 8;
}

message OntologyRelation {
  string name = 1;
  string description = 2;
  string domain = 3;
  string range = 4;
  Cardinality cardinality = 5;
  string inverse = 6;
  bool transitive = 7;
  bool is_builtin = 8;
  string mapped_relation = 9;
}

message Function {
  string name = 1;
  string description = 2;
  repeated FuncParam params = 3;
  repeated PipelineStep pipeline = 4;
  int64 created = 5;
}

message FuncParam {
  string name = 1;
  string type = 2;
  bool required = 3;
}

message PipelineStep {
  string op = 1;
  string kind = 2;
  string property = 3;
  string value = 4;
  string relation = 5;
  string dir = 6;
  string func = 7;
  string field = 8;
  string as = 9;
}

message Dataset {
  string id = 1;
  string name = 2;
  repeated ColumnDef columns = 3;
  string object_id = 4;
  int64 created = 5;
}

message ColumnDef {
  string name = 1;
  string type = 2;
  string classification = 3;
}

message RowFilter {
  string column = 1;
  string op = 2;
  string value = 3;
}

message RowQuery {
  repeated RowFilter filters = 1;
  repeated string columns = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message VirtualTable {
  string id = 1;
  string name = 2;
  string dataset_id = 3;
  repeated RowFilter filters = 4;
  repeated string columns = 5;
  int64 created = 6;
}

message Grant {
  string id = 1;
  string object_id = 2;
  string principal = 3;
  string role = 4;
  int64 created = 5;
}

message Decision {
  string id = 1;
  int64 timestamp = 2;
  string actor = 3;
  string action = 4;
  string reason = 5;
  map<string, string> evidence = 6;
  string target_id = 7;
  string outcome = 8;
}

message ObjectChange {
  string id = 1;
  string object_id = 2;
  string field = 3;
  string old_value = 4;
  string new_value = 5;
  string changed_by = 6;
  int64 timestamp = 7;
}

message ActionRequest {
  string action = 1;
  map<string, string> params = 2;
  // Advisory display label only. Authorization uses the authenticated caller
  // principal from request metadata, not this field.
  string actor = 3;
}

message ActionResult {
  string action = 1;
  string message = 2;
  bool dry_run = 3;              // set when the call was a dry run (no mutation)
  repeated string planned_ops = 4; // ops that would run, in order
  string decision = 5;          // resolved policy decision: allow|deny|require_approval
  string approval_id = 6;       // set when the action was held for approval (Phase B)
}

message ActionParamDef {
  string name = 1;
  string type = 2;
  bool required = 3;
  repeated string enum_values = 4;
}

message ActionOp {
  string op = 1;
  string property = 2;
  string value_from = 3;
  string relation = 4;
}

message ActionTypeDef {
  string name = 1;
  string description = 2;
  repeated ActionParamDef params = 3;
  repeated ActionOp ops = 4;
  string target_kind = 5;
  int64 created = 6;
  // Optional purpose required to invoke this action. Empty means no purpose gate.
  string required_purpose = 7;
}

// A versioned description of an existing native query, retrieval, or action
// surface. Object and action schemas reuse the canonical definitions above;
// the catalog does not introduce a second schema language.
message CapabilityEntry {
  string name = 1;
  string description = 2;
  string kind = 3; // query | retrieval | action
  string lifecycle_state = 4; // preview | active | deprecated | disabled | revoked
  string contract_version = 5;
  string minimum_compatible_version = 6;
  string maximum_compatible_version = 7;
  string replacement_capability = 8;
  string input_type = 9;  // canonical protobuf message name
  string output_type = 10; // canonical protobuf message name
  repeated string required_scopes = 11;
  repeated string policy_decision_points = 12;
  string risk_class = 13;
  string approval_behavior = 14; // none | may_require | required
  repeated CapabilityLimit limits = 15;
  ObjectType object_type = 16;
  ActionTypeDef action_type = 17;
  repeated string evidence_requirements = 18;
  // Product tier for discovery filters (#386 / research #383): core | advanced | experimental.
  // Empty means untagged (treated as advanced for filtering).
  string product_tier = 19;
}

message CapabilityLimit {
  string name = 1;
  uint64 value = 2;
}

message DiscoverCapabilitiesRequest {
  string namespace = 1;
  string contract_version = 2; // empty negotiates the latest supported version
  string catalog_version = 3; // pins pagination to an observed snapshot
  uint32 page_size = 4; // defaults to 50 and is capped at 200
  string page_token = 5;
  // Product-tier filter: empty = core. Use "all" to opt into the complete
  // catalog. Values: all | core | advanced | experimental.
  string product_tier_filter = 6;
}

message DiscoverCapabilitiesResponse {
  repeated CapabilityEntry capabilities = 1;
  string contract_version = 2;
  string catalog_version = 3;
  string next_page_token = 4;
  uint32 total_size = 5;
  string cache_scope = 6; // always authorization_context
}

// Fixed graph-backed profile for immutable requirement, invariant, and waiver
// facts. The contract is domain-neutral: subject profiles and references remain
// opaque integration-owned identifiers, while evaluation semantics are bound
// later by Chisei evaluation plans.
message GovernedFactApplicability {
  repeated string subject_profiles = 1;
  repeated string subject_refs = 2;
}

message InvariantVerificationContract {
  string predicate_kind = 1;
  string input_schema = 2;
  string result_schema = 3;
  repeated string evidence_types = 4;
}

message GovernedFactVersion {
  string contract_version = 1;
  string object_id = 2;
  string namespace = 3;
  string fact_id = 4;
  string version = 5;
  string fact_type = 6; // requirement | invariant
  string statement = 7;
  GovernedFactApplicability applicability = 8;
  InvariantVerificationContract verification = 9;
  repeated string requirement_version_ids = 10;
  // Exact IDs of authorized projected external_evidence graph objects.
  repeated string evidence_refs = 11;
  string source_ref = 12;
  int64 effective_from_ms = 13;
  string supersedes_object_id = 14;
  string content_digest = 15;
  string created_by = 16;
  int64 created_at_ms = 17;
  string access_marking = 18;
  string status = 19; // active | retired
}

message GovernedWaiverVersion {
  string contract_version = 1;
  string object_id = 2;
  string namespace = 3;
  string waiver_id = 4;
  string version = 5;
  repeated string invariant_version_ids = 6;
  GovernedFactApplicability applicability = 7;
  string reason = 8;
  repeated string evidence_refs = 9;
  string source_ref = 10;
  int64 valid_from_ms = 11;
  int64 expires_at_ms = 12;
  string supersedes_object_id = 13;
  string content_digest = 14;
  string created_by = 15;
  int64 created_at_ms = 16;
  string access_marking = 17;
}

message GetGovernedFactVersionRequest { string object_id = 1; }
message GetGovernedFactVersionResponse {
  GovernedFactVersion fact = 1;
}

message ResolveInvariantSetRequest {
  string namespace = 1;
  string subject_profile = 2;
  string subject_ref = 3;
  int64 evaluation_time_ms = 4;
  uint32 max_items = 5;
}
message ResolvedInvariantSet {
  string contract_version = 1;
  string set_id = 2;
  string set_digest = 3;
  string profile_digest = 4;
  string namespace = 5;
  string subject_profile = 6;
  string subject_ref = 7;
  int64 evaluation_time_ms = 8;
  repeated GovernedFactVersion requirements = 9;
  repeated GovernedFactVersion invariants = 10;
  repeated GovernedWaiverVersion waivers = 11;
}
message ResolveInvariantSetResponse {
  ResolvedInvariantSet invariant_set = 1;
}

message LineageNode {
  Object object = 1;
  string role = 2;
  bool ephemeral = 3;
}

message LineageEdge {
  string from = 1;
  string to = 2;
  string relation = 3;
}

message LineageResult {
  repeated LineageNode nodes = 1;
  repeated LineageEdge edges = 2;
  bool truncated = 3;
}

// --- Request/Response wrappers ---

// Optional lease_precondition unifies ordinary and generation-fenced writes.
message CreateObjectRequest {
  Object object = 1;
  LeasePrecondition lease_precondition = 2;
}
message CreateObjectResponse { Object object = 1; }
message GetObjectRequest { string id = 1; }
message GetObjectResponse { Object object = 1; }
message UpdateObjectRequest {
  Object object = 1;
  LeasePrecondition lease_precondition = 2;
}
message UpdateObjectResponse { Object object = 1; }
message DeleteObjectRequest {
  string id = 1;
  LeasePrecondition lease_precondition = 2;
}
message DeleteObjectResponse {}
message ListObjectsRequest { ListFilter filter = 1; }
message ListObjectsResponse { repeated Object objects = 1; int32 total = 2; }
message FindByExternalIdRequest { string external_id = 1; }
message FindByPropertyRequest { string kind = 1; string key = 2; string value = 3; }

message CreateLinkRequest { Link link = 1; bool fail_if_exists = 2; }
message CreateLinkResponse { Link link = 1; }
message DeleteLinkRequest { string id = 1; }
message DeleteLinkResponse {}
message GetLinksRequest { string object_id = 1; string relation = 2; string direction = 3; }
message GetLinksResponse { repeated Link links = 1; }
message GetLinkedObjectsRequest { string object_id = 1; string relation = 2; string direction = 3; }
message GetLinkedObjectsResponse { repeated Object objects = 1; }

message TraverseRequest { GraphQuery query = 1; }
message TraverseResponse { GraphResult result = 1; }

// A bounded, governed context-retrieval root. Exactly one field must be set.
message ContextRoot {
  string object_id = 1;
  string external_id = 2;
  string link_id = 3;
}

message RetrieveContextRequest {
  repeated ContextRoot roots = 1;
  repeated string relations = 2;
  string direction = 3; // outgoing | incoming | both; empty defaults to both
  uint32 max_depth = 4; // 0 is roots-only; values above 3 are capped
  uint32 max_objects = 5; // 0 defaults to 20; absolute cap is 100
  uint32 max_links = 6; // 0 defaults to 40 when expanding; cap is 200
  repeated string kind_filter = 7;
  string reasoning_mode = 8; // empty/asserted_only | entailment
  uint32 max_source_rows = 9; // 0 defaults to 200; cap is 1000
  uint32 max_derived_rows = 10; // 0 defaults to 100; cap is 500
  uint32 max_derivation_steps = 11; // 0 defaults to 12; cap is 32
  uint32 max_time_ms = 12; // 0 defaults to 100; cap is 1000
  uint64 max_explanation_bytes = 13; // 0 defaults to 1 MiB; cap is 16 MiB
}

message ContextDerivationStep {
  string kind = 1; // asserted | derived
  string relation = 2;
  string from_id = 3;
  string to_id = 4;
  repeated string source_fact_ids = 5;
  string ontology_revision = 6;
  string rule = 7; // root | graph_link | mapping | subclass | equivalence | transitive
}

message ContextExplanation {
  repeated ContextDerivationStep steps = 1;
  repeated string source_fact_ids = 2;
  string ontology_revision = 3;
  bool derived = 4;
}

// Versioned, source-neutral epistemic metadata projected from an existing
// authorization-filtered Sekai reference. It carries no source payload and is
// not durable epistemic authority.
message EpistemicDescriptor {
  string contract_version = 1;
  string origin_class = 2; // asserted | derived | hypothesis | unknown
  string evidence_status = 3; // supported | contested | insufficient | unknown
  string lifecycle_status = 4; // current | stale | retracted | superseded | unknown
  optional uint32 producer_confidence_bps = 5;
  string confidence_basis = 6; // producer_input when present
  optional int64 observed_at_ms = 7;
  string derivation_ref = 8;
  repeated string source_refs = 9;
  repeated string source_digests = 10;
  optional uint32 source_row_count = 11;
  bool source_rows_truncated = 12;
  optional uint32 supporting_evidence_count = 13;
  optional uint32 contradicting_evidence_count = 14;
}

message ContextCandidate {
  Object object = 1;
  uint32 depth = 2;
  string via_relation = 3;
  double affinity = 4;
  ContextExplanation explanation = 5;
  EpistemicDescriptor descriptor = 6;
}

message RetrieveContextResponse {
  repeated ContextCandidate candidates = 1;
  repeated Link links = 2;
  bool truncated = 3;
  uint32 unresolved_roots = 4;
  uint32 denied_objects = 5;
  uint32 truncated_objects = 6;
  uint32 truncated_links = 7;
  repeated string truncation_reasons = 8;
  uint32 source_rows = 9;
  uint32 derived_rows = 10;
  string ontology_revision = 11;
  string epistemic_descriptor_version = 12;
}

// Semantic catalog capabilities (#151). These are discoverable through
// DiscoverCapabilities and invokable with the #107 receipt-attributed binding
// (x-sekai-capability, x-sekai-namespace, x-sekai-operation-id). Natural-
// language planning and summarization remain outside Sekai.
message ExpandRelationsRequest {
  string namespace = 1;
  ContextRoot root = 2;
  repeated string relations = 3;
  string direction = 4; // outgoing | incoming | both; empty defaults to both
  string reasoning_mode = 5; // empty/asserted_only | entailment
  uint32 max_depth = 6; // 0 is roots-only; values above 3 are capped
  uint32 max_objects = 7; // 0 defaults to 20; absolute cap is 100
  uint32 max_links = 8; // 0 defaults to 40 when expanding; cap is 200
  repeated string kind_filter = 9;
  uint32 max_source_rows = 10; // 0 defaults to 200; cap is 1000
  uint32 max_derived_rows = 11; // 0 defaults to 100; cap is 500
  uint32 max_derivation_steps = 12; // 0 defaults to 12; cap is 32
  uint32 max_time_ms = 13; // 0 defaults to 100; cap is 1000
  uint64 max_explanation_bytes = 14; // 0 defaults to 1 MiB; cap is 16 MiB
}

message ExpandRelationsResponse {
  repeated ContextCandidate candidates = 1;
  repeated Link links = 2;
  bool truncated = 3;
  uint32 unresolved_roots = 4;
  uint32 denied_objects = 5;
  uint32 truncated_objects = 6;
  uint32 truncated_links = 7;
  repeated string truncation_reasons = 8;
  uint32 source_rows = 9;
  uint32 derived_rows = 10;
  string ontology_revision = 11;
  string reasoning_mode = 12;
  string epistemic_descriptor_version = 13;
}

message ExplainDerivationRequest {
  string namespace = 1;
  ContextRoot from = 2;
  ContextRoot to = 3;
  repeated string relations = 4;
  string direction = 5; // outgoing | incoming | both; empty defaults to both
  string reasoning_mode = 6; // empty/asserted_only | entailment
  uint32 max_depth = 7;
  uint32 max_objects = 8;
  uint32 max_links = 9;
  uint32 max_source_rows = 10;
  uint32 max_derived_rows = 11;
  uint32 max_derivation_steps = 12;
  uint32 max_time_ms = 13;
  uint64 max_explanation_bytes = 14;
}

message ExplainDerivationResponse {
  ContextExplanation explanation = 1;
  bool found = 2;
  bool truncated = 3;
  repeated string truncation_reasons = 4;
  string ontology_revision = 5;
  string reasoning_mode = 6;
  // Opaque evidence references (source fact ids). Never secrets or tokens.
  repeated string evidence_refs = 7;
  EpistemicDescriptor descriptor = 8;
}

message ListSchemaTypesRequest {}
message ListSchemaTypesResponse { repeated ObjectType types = 1; }
message CreateSchemaTypeRequest { ObjectType type = 1; }
message CreateSchemaTypeResponse { ObjectType type = 1; }
message ListOntologyClassesRequest {}
message ListOntologyClassesResponse { repeated OntologyClass classes = 1; }
message GetOntologyClassRequest { string name = 1; }
message GetOntologyClassResponse { OntologyClass class = 1; }
message CreateOntologyClassRequest { OntologyClass class = 1; }
message CreateOntologyClassResponse { OntologyClass class = 1; }
message DeleteOntologyClassRequest { string name = 1; }
message DeleteOntologyClassResponse {}

message ListOntologyRelationsRequest {}
message ListOntologyRelationsResponse { repeated OntologyRelation relations = 1; }
message GetOntologyRelationRequest { string name = 1; }
message GetOntologyRelationResponse { OntologyRelation relation = 1; }
message CreateOntologyRelationRequest { OntologyRelation relation = 1; }
message CreateOntologyRelationResponse { OntologyRelation relation = 1; }
message DeleteOntologyRelationRequest { string name = 1; }
message DeleteOntologyRelationResponse {}

message CreateFunctionRequest { Function function = 1; }
message CreateFunctionResponse { Function function = 1; }
message ListFunctionsRequest {}
message ListFunctionsResponse { repeated Function functions = 1; }

message CreateDatasetRequest { Dataset dataset = 1; }
message CreateDatasetResponse { Dataset dataset = 1; }
message UpdateDatasetRequest { Dataset dataset = 1; }
message UpdateDatasetResponse { Dataset dataset = 1; }
message ListDatasetsRequest {}
message ListDatasetsResponse { repeated Dataset datasets = 1; }
message AppendRowsRequest { string dataset_id = 1; repeated Row rows = 2; }
message Row { map<string, string> values = 1; }
message AppendRowsResponse { int32 count = 1; }
message QueryRowsRequest { string dataset_id = 1; RowQuery query = 2; }
message QueryRowsResponse { repeated Row rows = 1; }

message CreateVirtualTableRequest { VirtualTable table = 1; }
message CreateVirtualTableResponse { VirtualTable table = 1; }
message ListVirtualTablesRequest {}
message ListVirtualTablesResponse { repeated VirtualTable tables = 1; }

message CreateGrantRequest { Grant grant = 1; }
message CreateGrantResponse { Grant grant = 1; }
message DeleteGrantRequest { string id = 1; }
message DeleteGrantResponse {}
message ListGrantsRequest { string object_id = 1; }
message ListGrantsResponse { repeated Grant grants = 1; }
message CheckAccessRequest { string object_id = 1; repeated string principals = 2; }
message CheckAccessResponse { bool allowed = 1; }
message EnsureTeamNamespaceRequest {
  string namespace = 1;
  string principal = 2;
  string role = 3;
}
message EnsureTeamNamespaceResponse {
  Object namespace = 1;
  repeated Grant grants = 2;
}

message RecordDecisionRequest { Decision decision = 1; }
message RecordDecisionResponse { Decision decision = 1; }
message ListDecisionsRequest { string actor = 1; string action = 2; int64 after = 3; int32 limit = 4; string target_id = 5; }
message ListDecisionsResponse { repeated Decision decisions = 1; }
message ListObjectChangesRequest { string object_id = 1; int32 limit = 2; int32 offset = 3; }
message ListObjectChangesResponse { repeated ObjectChange changes = 1; }

message PolicyAttestation {
  string id = 1;
  string decision_id = 2;       // the audit decision this attestation authorizes
  string policy_kind = 3;       // e.g. action_policy
  string policy_scope = 4;
  string policy_version = 5;    // content hash of policy_snapshot
  string policy_snapshot = 6;   // canonical JSON of the policy pinned at decision time
  map<string, string> inputs = 7; // action, actor, risk_class, namespace
  string decision = 8;          // allow | deny | require_approval
  string content_hash = 9;
  int64 created = 10;
}
message GetAttestationRequest { string id = 1; }
message GetAttestationResponse { PolicyAttestation attestation = 1; }
message ListAttestationsRequest {
  string decision_id = 1;
  string policy_scope = 2;
  int32 limit = 3;
  int32 offset = 4;
}
message ListAttestationsResponse { repeated PolicyAttestation attestations = 1; }
message VerifyAttestationRequest { string id = 1; }
message VerifyAttestationResponse {
  bool ok = 1;
  bool found = 2;
  bool hash_ok = 3;            // stored hashes match recomputation
  bool replay_ok = 4;          // pinned policy replayed over inputs re-derives the decision
  string replayed_decision = 5;
  bool decision_linked = 6;    // linked audit decision binds this attestation back
  string error = 7;
}
message ListActionTypesRequest {}
message ListActionTypesResponse { repeated ActionTypeDef action_types = 1; }
message DeleteActionTypeRequest { string name = 1; }
message DeleteActionTypeResponse {}

// Governed Action type registry (#396 / research #395). Distinct from graph ActionTypeDef.
message GovernedActionType {
  string namespace = 1;
  string type_id = 2;
  string version = 3;
  string description = 4;
  string parameter_schema_json = 5;
  repeated string allowed_effect_kinds = 6;
  string policy_scope = 7;
  string budget_scope = 8;
  bool enabled = 9;
  string created_by = 10;
  int64 created_at_ms = 11;
  int64 updated_at_ms = 12;
  int64 disabled_at_ms = 13;
}
message PutGovernedActionTypeRequest { GovernedActionType type = 1; string request_id = 2; }
message PutGovernedActionTypeResponse { GovernedActionType type = 1; }
message GetGovernedActionTypeRequest { string namespace = 1; string type_id = 2; string version = 3; }
message GetGovernedActionTypeResponse { GovernedActionType type = 1; }
message ListGovernedActionTypesRequest {
  string namespace = 1;
  string type_id = 2;
  bool enabled_only = 3;
}
message ListGovernedActionTypesResponse { repeated GovernedActionType types = 1; }
message SetGovernedActionTypeEnabledRequest {
  string namespace = 1;
  string type_id = 2;
  string version = 3;
  bool enabled = 4;
  string request_id = 5;
}
message SetGovernedActionTypeEnabledResponse { GovernedActionType type = 1; }

// Governed ActionInstance admission (#397 / research #395). Not graph ExecuteAction.
message ActionInstance {
  string instance_id = 1;
  string namespace = 2;
  string type_id = 3;
  string version = 4;
  string principal = 5;
  // JSON object. Untrusted producer/user content — plane never treats as instructions.
  string parameters_json = 6;
  string request_digest = 7;
  string idempotency_key = 8;
  // Bound operation correlation spine for receipts/harvest.
  string operation_id = 9;
  // admitted | denied
  string status = 10;
  string deny_reason = 11;
  repeated string evidence_submission_ids = 12;
  string policy_decision = 13;
  string budget_decision = 14;
  int64 created_at_ms = 15;
  int64 decided_at_ms = 16;
}
message SubmitActionInstanceRequest {
  string namespace = 1;
  string type_id = 2;
  string version = 3;
  string parameters_json = 4;
  string idempotency_key = 5;
  repeated string evidence_submission_ids = 6;
  string request_id = 7;
}
message SubmitActionInstanceResponse {
  ActionInstance instance = 1;
  bool replay = 2;
}
message GetActionInstanceRequest {
  string instance_id = 1;
  // Optional alternate lookup when instance_id empty.
  string namespace = 2;
  string idempotency_key = 3;
}
message GetActionInstanceResponse { ActionInstance instance = 1; }
message ListActionInstancesRequest {
  string namespace = 1;
  string type_id = 2;
  string status = 3;
  uint32 limit = 4;
}
message ListActionInstancesResponse { repeated ActionInstance instances = 1; }

// Typed ActionInstance effects (#398). Children of admitted instances.
message ActionEffect {
  string effect_id = 1;
  string instance_id = 2;
  string namespace = 3;
  string operation_id = 4;
  // runtime_dispatch | notify | external_mutate
  string kind = 5;
  // pending | claimed | sent | failed | skipped | completed | parked
  string status = 6;
  string payload_json = 7;
  string failure_reason = 8;
  int64 created_at_ms = 9;
  int64 updated_at_ms = 10;
  string claim_owner = 11;
  uint64 claim_generation = 12;
  string claim_fencing_token = 13;
  int64 claim_expires_at_ms = 14;
  string claim_request_id = 15;
  uint64 park_generation = 16;
  string active_resolution_id = 17;
  uint32 claim_attempt_count = 18;
  uint32 lease_expiry_count = 19;
  uint32 park_count = 20;
  // ready | claimed | awaiting_continuation | completed | failed |
  // dead_lettered | superseded
  string lifecycle_state = 21;
  string retry_policy_version = 22;
  string retry_policy_digest = 23;
  uint32 max_claim_attempts = 24;
  uint32 max_lease_expiries = 25;
