  repeated string lifecycle_history = 2;
}
message GetEvidenceSubmissionContentRequest { string submission_id = 1; }
// Returns one retained admitted envelope after rechecking the live ACL on its
// projected external_evidence object. Missing, unreadable, and non-disclosable
// lifecycle states all return NOT_FOUND.
message GetEvidenceSubmissionContentResponse {
  string submission_id = 1;
  EvidenceEnvelope envelope = 2;
  string lifecycle_state = 3;
}
message ListEvidenceSubmissionsRequest {
  string producer_identity = 1;
