syntax = "proto3";
package chisei;

// --- Messages ---

message BudgetUsage {
  string user_id = 1;
  int32 tokens_used = 2;
  int32 max_tokens = 3;
  string period_type = 4;
  int64 period_start = 5;
}

message PolicyResolution {
  string runtime = 1;
  string model = 2;
  bool eval_regressed = 3;
  string eval_regression_reason = 4;
  string data_class = 5;
  // Cost-tier bias applied for this resolution ("cheap" when a bulk task class
  // was routed to a cheaper model; empty for the default capable tier).
  string route_bias = 6;
  // Scope whose policy produced this resolution and the content hash of that
  // policy revision. Empty when no policy applied (implicit allow). Callers
  // should carry these into audit evidence so the decision is reproducible.
  string policy_scope = 7;
  string policy_version = 8;
  // Policy-authorized alternatives. The gateway still rechecks health,
  // capabilities, governance, egress, and budget before selecting one.
  repeated string fallback_models = 9;
}

message StepDecision {
  string step = 1;
  string action = 2;
  string reasoning = 3;
  double confidence = 4;
  string suggestion = 5;
  string value = 6;
}

// Versioned, source-neutral epistemic metadata. The three status dimensions
// are independent; "unknown" is explicit when the authoritative projection
// cannot establish a value. Payload content is never carried here.
message EpistemicDescriptor {
  string contract_version = 1;
  string origin_class = 2; // asserted | derived | hypothesis | unknown
  string evidence_status = 3; // supported | contested | insufficient | unknown
  string lifecycle_status = 4; // current | stale | retracted | superseded | unknown
  optional uint32 producer_confidence_bps = 5;
  string confidence_basis = 6; // producer_input when present
  optional int64 observed_at_ms = 7;
  string derivation_ref = 8;
  repeated string source_refs = 9;
  repeated string source_digests = 10;
  optional uint32 source_row_count = 11;
  bool source_rows_truncated = 12;
  optional uint32 supporting_evidence_count = 13;
  optional uint32 contradicting_evidence_count = 14;
}

message MemoryContextReference {
  string memory_id = 1;
  uint32 memory_version = 2;
  string classification = 3;
  uint32 confidence_bps = 4;
  string applicability = 5;
  repeated string evidence_operation_ids = 6;
  string content_digest = 7;
  EpistemicDescriptor descriptor = 8;
}

message MemoryHoldoutReference {
  string memory_id = 1;
  uint32 memory_version = 2;
  string classification = 3;
  string content_digest = 4;
}

message ContextEvidenceReference {
  string submission_id = 1;
  string source_type = 2;
  string source_instance = 3;
  string source_version = 4;
  int64 source_sequence = 5;
  string evidence_type = 6;
  string schema_id = 7;
  string schema_version = 8;
  string content_digest = 9;
  int64 observed_at_ms = 10;
  string classification = 11;
  string projection_version = 12;
  repeated string disclosed_fields = 13;
  EpistemicDescriptor descriptor = 14;
}

message ChatMessage {
  string role = 1;
  string content = 2;
  string tool_call_id = 3;
  repeated ToolCall tool_calls = 4;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string args_json = 3;
}

message ToolDef {
  string name = 1;
  string description = 2;
  string input_schema_json = 3;
}

message ReviewPolicy {
  double confidence_threshold = 1;
  int32 max_cycles = 2;
  string model = 3;
}

message BudgetVerdict {
  bool allowed = 1;
  BudgetUsage usage = 2;
  string reason = 3;
}

message ExecutionInput {
  string request_id = 1;
  string namespace = 2;
  string spec = 3;
  string preferred_model = 4;
  string preferred_runtime = 5;
  string task_type = 6;
  int32 priority = 7;
  string user_id = 8;
  int32 estimated_tokens = 9;
  repeated ChatMessage messages = 10;
  repeated ToolDef tools = 11;
  string system = 12;
  int32 max_tokens = 13;
  string task_class = 14;
  reserved 15;
  reserved "agent_id";
  // Optional caller-owned lineage. The receipt id remains a distinct,
  // Chisei-owned identifier for this governed execution.
  string logical_operation_id = 16;
  string attempt_id = 17;
  // Optional canonical provider/model pinned for this one governed execution.
  string route_override = 18;
}

message ExecutionPlan {
  string plan_id = 1;
  ExecutionInput input = 2;
  string resolved_runtime = 3;
  string resolved_model = 4;
  string enriched_spec = 5;
  string prepared_system = 6;
  repeated ChatMessage prepared_messages = 7;
  repeated ToolDef tools = 8;
  BudgetVerdict budget = 9;
  repeated StepDecision steps = 10;
  ReviewPolicy review_policy = 11;
  double risk_score = 12;
  bool low_success_namespace = 13;
  bool executable = 14;
  repeated string warnings = 15;
  int32 max_tokens = 16;
  int64 created_at = 17;
  repeated string affinity_namespaces = 18;
  bool eval_regressed = 19;
  string eval_regression_reason = 20;
  bool sampled = 21;
  double sample_rate = 22;
  string sample_reason = 23;
  repeated EgressDecision egress_decisions = 24;
  string task_class = 25;
  repeated ContextEvidenceReference evidence_references = 26;
  repeated MemoryContextReference memory_references = 27;
  string planning_actor = 28;
  repeated MemoryHoldoutReference memory_holdouts = 29;
  string context_admission_policy_version = 30;
  string context_admission_descriptor_version = 31;
  string context_admission_decision = 32;
  repeated string context_admission_reasons = 33;
  repeated string context_admission_source_digests = 34;
  bool context_admission_requires_review = 35;
  bool context_admission_requires_verification = 36;
  uint64 context_bytes = 37;
  uint64 context_tokens = 38;
  uint64 context_projection_latency_ms = 39;
  bool context_truncated = 40;
  // Present only when this plan is bound to a durable Gunshi allocation.
  string gunshi_issuance_id = 41;
  string gunshi_allocation_id = 42;
  string gunshi_agent_id = 43;
  string gunshi_policy_version = 44;
  string gunshi_input_fingerprint = 45;
  int64 gunshi_budget_ceiling_usd_micros = 46;
  uint32 gunshi_max_attempts = 47;
  bool gunshi_human_review_required = 48;
}

message EgressDecision {
  string provider = 1;
  bool external = 2;
  repeated string included = 3;
  repeated string redacted = 4;
  repeated string reasons = 5;
}

message PlannedChatResponse {
  string content = 1;
  repeated ToolCall tool_calls = 2;
  int32 input_tokens = 3;
  int32 output_tokens = 4;
  string stop_reason = 5;
  string provider = 6;
  int32 cache_read_input_tokens = 7;
  int32 cache_creation_input_tokens = 8;
}

message EvalAssertion {
  string type = 1;
  string value = 2;
}

message EvalCase {
  string id = 1;
  string name = 2;
  string namespace = 3;
  string spec = 4;
  repeated EvalAssertion assertions = 5;
}

message EvalSuite {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated EvalCase cases = 4;
}

message CaseResult {
  string case_id = 1;
  bool passed = 2;
  string status = 3;
  string result = 4;
  int32 score = 5;
  string reason = 6;
  int64 elapsed = 7;
}

message EvalRun {
  string id = 1;
  string suite_id = 2;
  string config_ref = 3;
  repeated CaseResult results = 4;
  int64 timestamp = 5;
}
message GetEvalSuiteRequest { string id = 1; }
message GetEvalSuiteResponse { EvalSuite suite = 1; }
message GetEvalRunRequest { string id = 1; }
message GetEvalRunResponse { EvalRun run = 1; }
message ListEvalRunsRequest { string suite_id = 1; }
message ListEvalRunsResponse { repeated EvalRun runs = 1; }

// Immutable, operator-controlled deterministic evaluator metadata. This
// registers deployed implementation identity; it never uploads executable code.
message EvaluatorResourceLimits {
  uint64 timeout_ms = 1;
  uint64 max_input_bytes = 2;
  uint64 max_output_bytes = 3;
  uint32 max_evidence_items = 4;
}
// Situation-specific model evaluation policy. Integer units make the policy
// canonical across runtimes: scores are millionths, pass rate is basis points,
// temperature is thousandths, and top-p is millionths.
message StochasticEvaluatorPolicy {
  string provider = 1;
  string model = 2;
  string prompt_profile = 3;
  string prompt_profile_digest = 4;
  string result_schema = 5;
  uint32 trial_count = 6;
  uint32 temperature_millis = 7;
  uint32 top_p_millionths = 8;
  bool seed_supported = 9;
  int64 base_seed = 10;
  string aggregation_rule = 11; // mean_score_with_variance/v1
  uint32 minimum_mean_score_micros = 12;
  uint32 minimum_pass_rate_basis_points = 13;
  uint64 maximum_score_variance_micros_squared = 14;
  bool gate_eligible = 15;
  uint32 max_retries_per_trial = 16;
  uint32 max_tokens_per_trial = 17;
  uint32 max_total_tokens = 18;
  string egress_policy = 19; // local_only/v1 | allowlisted_external/v1
  string raw_response_retention = 20; // none/v1
}
message EvaluatorDefinition {
  string contract_version = 1; // chisei.evaluator-definition/v1
  string definition_id = 2;
  string namespace = 3;
  string evaluator_id = 4;
  string version = 5;
  string implementation_digest = 6;
  string execution_class = 7; // deterministic_builtin/v1
  repeated string supported_predicate_kinds = 8;
  repeated string supported_input_schemas = 9;
  repeated string supported_result_schemas = 10;
  // Closed v1 JSON-Schema subset: a flat object of typed scalar parameters.
  string parameter_schema_json = 11;
  repeated string evidence_classifications = 12;
  EvaluatorResourceLimits resource_limits = 13;
  string source_ref = 14;
  string content_digest = 15;
  string created_by = 16;
  int64 created_at_ms = 17;
  optional StochasticEvaluatorPolicy stochastic_policy = 18;
  // HTTPS endpoint for an operator-deployed external_adapter/v1 evaluator.
  // This never uploads executable code and is empty for built-in/stochastic definitions.
  string adapter_endpoint = 19;
}
message EvaluatorAvailability {
  string definition_id = 1;
  string state = 2; // enabled | disabled | superseded
  string superseded_by_definition_id = 3;
  string reason = 4;
  string request_id = 5;
  string request_digest = 6;
  string changed_by = 7;
  int64 changed_at_ms = 8;
}
message EvaluatorDefinitionRecord {
  EvaluatorDefinition definition = 1;
  EvaluatorAvailability availability = 2;
  // Capability discovery: metadata may be published while the exact implementation
  // is not executable in this Chisei process.
  bool implementation_executable = 3;
  string implementation_status = 4; // executable | unavailable | unsupported
}
message PutEvaluatorDefinitionRequest {
  EvaluatorDefinition definition = 1;
  // When definition is omitted, mutate the lifecycle of an existing exact version.
  string definition_id = 2;
  string availability_state = 3;
  string superseded_by_definition_id = 4;
  string reason = 5;
  string request_id = 6;
}
message PutEvaluatorDefinitionResponse { EvaluatorDefinitionRecord record = 1; }

// A situation-specific immutable plan over exact evaluator and invariant
// versions. Nodes are deterministic evaluation only; they cannot execute
// actions, scripts, deployments, or caller-defined reducers.
message EvaluationInputBinding {
  string name = 1;
  string source_kind = 2; // subject | invariant | evidence
  string schema_id = 3;
}
message EvaluationPlanNode {
  string node_id = 1;
  string evaluator_definition_id = 2;
  repeated string depends_on_node_ids = 3;
  repeated EvaluationInputBinding input_bindings = 4;
  string parameters_json = 5;
  repeated string invariant_version_ids = 6;
  string classification = 7; // required | advisory
}
message EvaluationPlan {
  string contract_version = 1; // chisei.evaluation-plan/v1
  string plan_version_id = 2;
  string namespace = 3;
  string plan_id = 4;
  string version = 5;
  repeated string accepted_subject_profiles = 6;
  repeated EvaluationPlanNode nodes = 7;
  string reducer = 8; // required_all_pass_advisory_observed/v1
  string source_ref = 9;
  string content_digest = 10;
  string created_by = 11;
  int64 created_at_ms = 12;
}
message PutEvaluationPlanRequest { EvaluationPlan plan = 1; }
message PutEvaluationPlanResponse { EvaluationPlan plan = 1; }

// Resolves immutable plan, subject, invariant, waiver, evaluator, and evidence
// inputs into durable content-bound execution evidence. Resolution performs no
// evaluator execution and grants no action authority.
message EvaluationResolutionRequest {
  string contract_version = 1; // chisei.evaluation-resolution-request/v1
  string resolver_version = 2; // chisei.evaluation-resolver/v1
  string namespace = 3;
  string request_id = 4;
  string plan_version_id = 5;
  string subject_profile = 6;
  string subject_identity = 7;
  string subject_content_digest = 8;
  repeated string evidence_object_ids = 9;
  int64 evaluation_time_ms = 10;
}
message ResolvedEvaluatorBinding {
  string definition_id = 1;
  string definition_digest = 2;
  string implementation_digest = 3;
  optional StochasticEvaluatorPolicy stochastic_policy = 4;
}
message ResolvedEvidenceBinding {
  string evidence_object_id = 1;
  string submission_id = 2;
  string content_digest = 3;
  string evidence_type = 4;
  string schema_id = 5;
  string schema_version = 6;
  string classification = 7;
  int64 observed_at_ms = 8;
  int64 expires_at_ms = 9; // zero means the admitted envelope has no expiry
  string source_identity_digest = 10;
}
message ResolvedWaiverBinding {
  string waiver_version_id = 1;
  string content_digest = 2;
  repeated string evidence_object_ids = 3;
  repeated string invariant_version_ids = 4;
}
message ResolvedRequirementBinding {
  string requirement_version_id = 1;
  string content_digest = 2;
  repeated string provenance_evidence_object_ids = 3;
}
message ResolvedInvariantBinding {
  string invariant_version_id = 1;
  string content_digest = 2;
  string predicate_kind = 3;
  string input_schema = 4;
  string result_schema = 5;
  repeated string evidence_types = 6;
  repeated string provenance_evidence_object_ids = 7;
  repeated string waiver_version_ids = 8;
}
message ResolvedInputBinding {
  string name = 1;
  string source_kind = 2;
  string schema_id = 3;
}
message ResolvedEvaluationNode {
  string node_id = 1;
  ResolvedEvaluatorBinding evaluator = 2;
  repeated string depends_on_node_ids = 3;
  repeated ResolvedInputBinding input_bindings = 4;
  string parameters_json = 5;
  repeated ResolvedInvariantBinding invariants = 6;
  repeated string evidence_object_ids = 7;
  string classification = 8;
}
message ResolvedEvaluationManifest {
  string contract_version = 1; // chisei.resolved-evaluation-manifest/v1
  string resolver_version = 2;
  string manifest_id = 3;
  string manifest_digest = 4;
  string namespace = 5;
  string plan_version_id = 6;
  string plan_digest = 7;
  string subject_profile = 8;
  string subject_identity = 9;
  string subject_content_digest = 10;
  string invariant_set_id = 11;
  string invariant_set_digest = 12;
  string invariant_profile_digest = 13;
  int64 evaluation_time_ms = 14;
  string resolved_by = 15;
  repeated ResolvedEvaluationNode nodes = 16;
  repeated ResolvedEvidenceBinding evidence = 17;
  repeated ResolvedWaiverBinding waivers = 18;
  int64 created_at_ms = 19;
  repeated ResolvedRequirementBinding requirements = 20;
}
message EvaluationResolutionFinding {
  string code = 1;
  string severity = 2; // blocking | advisory
  string node_id = 3; // empty when disclosure would be unsafe
  string invariant_version_id = 4; // empty when disclosure would be unsafe
}
message ResolveEvaluationPlanRequest {
  EvaluationResolutionRequest resolution = 1;
}
message ResolveEvaluationPlanResponse {
  string status = 1; // resolved | unknown | unavailable
  ResolvedEvaluationManifest manifest = 2;
  repeated EvaluationResolutionFinding findings = 3;
}

// Executes one exact resolved manifest through compiled deterministic
// implementations. The manifest digest is the execution idempotency key.
message EvaluationExecutionRequest {
  string contract_version = 1; // chisei.evaluation-execution-request/v1
  string executor_version = 2; // chisei.deterministic-evaluation-executor/v1
  string namespace = 3;
  string manifest_digest = 4;
  uint64 max_total_duration_ms = 5; // zero selects the bounded server default
}
message StochasticTrialEvidence {
  uint32 trial_index = 1;
  int64 seed = 2;
  uint32 attempt_count = 3;
  string status = 4;
  string reason_code = 5;
  uint32 score_micros = 6;
  uint32 input_tokens = 7;
  uint32 output_tokens = 8;
  string result_digest = 9;
  // Full per-attempt ceiling charged when a retryable provider error cannot
  // report partial usage.
  uint32 retry_accounted_tokens = 10;
}
message StochasticStepEvidence {
  string contract_version = 1; // chisei.stochastic-step-evidence/v1
  string provider = 2;
  string model = 3;
  string prompt_profile = 4;
  string prompt_profile_digest = 5;
  string result_schema = 6;
  uint32 trial_count = 7;
  string aggregation_rule = 8;
  uint32 minimum_mean_score_micros = 9;
  uint32 minimum_pass_rate_basis_points = 10;
  uint64 maximum_score_variance_micros_squared = 11;
  bool gate_eligible = 12;
  uint32 completed_trial_count = 13;
  uint32 mean_score_micros = 14;
  uint32 pass_rate_basis_points = 15;
  uint64 score_variance_micros_squared = 16;
  uint32 total_input_tokens = 17;
  uint32 total_output_tokens = 18;
  repeated StochasticTrialEvidence trials = 19;
  string aggregate_digest = 20;
  uint32 total_retry_accounted_tokens = 21;
}
message EvaluationStepReceipt {
  string contract_version = 1; // chisei.evaluation-step-receipt/v1
  string manifest_digest = 2;
  string node_id = 3;
  string classification = 4; // required | advisory
  string status = 5; // pass | fail | unknown | unavailable | error | skipped
  string reason_code = 6;
  string input_digest = 7;
  string parameters_digest = 8;
  string evaluator_definition_digest = 9;
  string implementation_digest = 10;
  repeated string evidence_digests = 11;
  repeated string dependency_result_digests = 12;
  reserved 13; // evaluator output content is never persisted or disclosed
  string result_digest = 14;
  string step_receipt_digest = 15;
  optional StochasticStepEvidence stochastic_evidence = 16;
}
message InvariantCoverageDecision {
  string invariant_version_id = 1;
  repeated string covered_by_node_ids = 2;
  repeated string waiver_version_ids = 3;
  bool satisfied = 4;
}
message EvaluationGateDecision {
  string contract_version = 1; // chisei.evaluation-gate-decision/v1
  string manifest_digest = 2;
  string reducer = 3;
  string verdict = 4; // allow | deny | unknown | unavailable
  string reason_code = 5;
  repeated string step_receipt_digests = 6;
  repeated InvariantCoverageDecision invariant_coverage = 7;
  string decision_digest = 8;
}
message EvaluationExecutionProjection {
  string manifest_digest = 1;
  string operation_id = 2;
  string namespace = 3;
  string status = 4; // running | cancelled | allow | deny | unknown | unavailable
  repeated EvaluationStepReceipt steps = 5;
  EvaluationGateDecision decision = 6;
}
message ExecuteEvaluationManifestRequest {
  EvaluationExecutionRequest execution = 1;
}
message ExecuteEvaluationManifestResponse {
  EvaluationExecutionProjection execution = 1;
}
message CancelEvaluationExecutionRequest {
  string namespace = 1;
  string manifest_digest = 2;
}
message CancelEvaluationExecutionResponse {
  EvaluationExecutionProjection execution = 1;
}

message GateDecision {
  string verdict = 1;
  string reason = 2;
  double baseline_score = 3;
  double candidate_score = 4;
}

message EvalIteration {
  string id = 1;
  string run_id = 2;
  string suite_id = 3;
  string changed_file = 4;
  string diff_hash = 5;
  string parent_iteration_id = 6;
  string baseline_run_id = 7;
  string candidate_run_id = 8;
  double delta = 9;
  bool regressed = 10;
  int64 created = 11;
}

// --- Request/Response wrappers ---

message DecideGatewayExecutionRequest {
  // Must be gateway.decide/v2. Version 2 makes the policy decision complete
  // enough for the gateway to remain a translator rather than a policy engine.
  string contract_version = 1;
  string namespace = 2;
  string requested_model = 3;
  string operation_class = 4;
  int64 estimated_cost_usd_micros = 5;
  string correlation_operation_id = 6;
  uint32 correlation_attempt = 7;
  // Token estimate for canonical budget preflight.
  int32 estimated_tokens = 8;
  string task_class = 9;
  string preferred_runtime = 10;
  // Optional budget hierarchy fields (project defaults to namespace).
  string project = 11;
  string agent = 12;
  string key_id = 13;
  string work_unit = 14;
  bool local_free_available = 15;
  // Subject and policy-resolution inputs required for the gateway's single
  // canonical admission decision.
  string user_id = 16;
  string route_override = 17;
  bytes capability_requirements_json = 18;
  int64 expected_calls = 19;
  // Request text used by the control plane's internal sampling pipeline.
  // The gateway receives only the governed prepared form needed when a
  // sampled outcome is retained.
  string pipeline_spec = 20;
}

message DecideGatewayExecutionResponse {
  string contract_version = 1;
  // When false, deny_reason is set and the edge must not contact upstream.
  bool admitted = 2;
  // unauthorized | capability_unsupported | policy_denied | budget_denied |
  // residency_denied | invalid_request
  string deny_reason = 3;
  string deny_message = 4;
  string resolved_runtime = 5;
  string resolved_model = 6;
  string policy_version = 7;
  string budget_scope = 8;
  // Opaque grant stamp for usage recording / receipt correlation.
  string budget_grant_id = 9;
  string route_bias = 10;
  string degradation_level = 11;
  bool budget_warning = 12;
  // Complete policy provenance and enforcement inputs returned to the thin
  // gateway PEP so it never reconstructs policy locally.
  string policy_scope = 13;
  string data_class = 14;
  repeated string fallback_models = 15;
  bool eval_regressed = 16;
  string eval_regression_reason = 17;
  string context_admission_policy_version = 18;
  string context_admission_descriptor_version = 19;
  string context_admission_decision = 20;
  repeated string context_admission_reasons = 21;
  bool sampling_evaluated = 22;
  bool sampled = 23;
  double sample_rate = 24;
  string sample_reason = 25;
  string prepared_spec = 26;
}
message RecordUsageRequest {
  string user_id = 1;
  int32 tokens_used = 2;
  string subject = 3;
  string project = 4;
  string agent = 5;
  string key_id = 6;
  string work_unit = 7;
  // Optional metric selector for this usage delta.
  // Uses the same unit field name `tokens_used` for backwards compatibility.
  // Supported values: "tokens" (default) and "requests".
  string metric = 8;
  // Stable caller-generated key. Replays with the same key are acknowledged
  // without applying the usage delta twice.
  string idempotency_key = 9;
  // Optional complete canonical receipt finalized by the trusted gateway for
  // the same request. Receipt persistence is idempotent and independent from
  // the accounting delta.
  string operation_receipt_json = 10;
  // Optional sampled outcome captured by the same trusted accounting write.
  SampleObservation sample_observation = 11;
}
message RecordUsageResponse {
  BudgetUsage usage = 1;
  bool sample_recorded = 2;
}
message SetBudgetLimitRequest {
  string user_id = 1;
  int32 max_tokens = 2;
  string period_type = 3;
  string subject = 4;
  string project = 5;
  string agent = 6;
  string key_id = 7;
  string work_unit = 8;
  // Optional metric selector to set a scoped budget for a specific metric.
  // Supported values: "tokens" (default) and "requests".
  string metric = 9;
}
message SetBudgetLimitResponse {}

message SetNamespacePolicyRequest {
  string namespace = 1;
  repeated string allowed_runtimes = 2;
  repeated string allowed_models = 3;
  string default_runtime = 4;
  string default_model = 5;
  string data_class = 6;
  // Canonical JSON for the opt-in chisei.context-admission/v1 policy.
  // Empty preserves an existing context policy; JSON null clears it.
  string context_admission_policy_json = 7;
}
message SetNamespacePolicyResponse { PolicyResolution resolution = 1; }

message GetEffectivePolicySummaryRequest {
  string namespace = 1;
  string provider = 2;
}
message AvailableModelCapabilities {
  bool responses = 1;
  bool streaming = 2;
  bool tools = 3;
  bool parallel_tools = 4;
  bool structured_output = 5;
  bool reasoning_controls = 6;
  repeated string modalities = 7;
  bool provider_continuation = 8;
  bool reports_usage = 9;
  bool partial_usage = 10;
  uint64 context_tokens = 11;
  optional uint64 output_tokens = 12;
  repeated string built_in_tools = 13;
}
message AvailableModelPricing {
  string version = 1;
  string source = 2;
  optional string observed_at = 3;
  repeated string dimensions = 4;
}
message AvailableModelRecord {
  string provider = 1;
  string upstream_model = 2;
  string canonical_model = 3;
  string lifecycle = 4;
  AvailableModelCapabilities capabilities = 5;
  AvailableModelPricing pricing = 6;
}
message EffectiveRoutingSummary {
  bool configured = 1;
  string status = 2;
  string runtime = 3;
  string model = 4;
  string policy_scope = 5;
  string policy_version = 6;
}
message EffectiveBudgetLimit {
  string metric = 1;
  int64 max_amount = 2;
  string period_type = 3;
  string policy_scope = 4;
}
message EffectiveBudgetSummary {
  bool configured = 1;
