}

message ReserveGatewayRequestAliasRequest {
  string caller_scope = 1;
  string request_alias = 2;
  string request_id = 3;
  string operation_id = 4;
}

message ReserveGatewayRequestAliasResponse {
  bool reserved = 1;
}
message ClaimGatewayRequestAliasDispatchRequest {
  string caller_scope = 1;
  string request_alias = 2;
  string request_id = 3;
  string operation_id = 4;
  string dispatch_token = 5;
}
message ClaimGatewayRequestAliasDispatchResponse {
  bool claimed = 1;
}
message GetOperationReceiptResponse {
  string receipt_json = 1;
  bool complete = 2;
  repeated string missing_surfaces = 3;
}

message QueryOperationStatisticsRequest {
  repeated string namespaces = 1;
  int64 start_timestamp_ms = 2;
  int64 end_timestamp_ms = 3;
}

message OperationStatisticValue {
  map<string, string> labels = 1;
  int64 value = 2;
}

message OperationStatisticsTotals {
  int64 logical_operations = 1;
  int64 receipts = 2;
  int64 model_calls = 3;
  int64 priced_model_calls = 4;
  int64 unpriced_model_calls = 5;
  int64 model_calls_without_model = 6;
  int64 total_cost_usd_micros = 7;
  int64 waiting_operations = 8;
  int64 waiting_time_ms = 9;
}

message OperationOutcomeCounts {
  int64 verified = 1;
  int64 failed = 2;
  int64 parked = 3;
  int64 rejected = 4;
  int64 unverified = 5;
  int64 unknown = 6;
}

message OperationLearningCounts {
  int64 learnings_admitted = 1;
  int64 enrichments_served = 2;
