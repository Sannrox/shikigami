message ReportOperationEventResponse {
  string event_id = 1;
  bool recorded = 2;
  bool complete = 3;
  repeated string missing_surfaces = 4;
}

message AuthorizeOperationReporterRequest {
  string operation_id = 1;
  string principal = 2;
  repeated string event_kinds = 3;
}

message AuthorizeOperationReporterResponse {
  bool authorized = 1;
  bool changed = 2;
}

message GetOperationReceiptRequest {
  string operation_id = 1;
  string request_id = 2;
  string caller_scope = 3;
