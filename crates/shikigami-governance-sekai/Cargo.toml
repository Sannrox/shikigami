[package]
name = "shikigami-governance-sekai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "sekai-chisei governance adapter for shikigami."

[dependencies]
shikigami-engine = { path = "../shikigami-engine", default-features = false }
shikigami-plane-intake = { path = "../shikigami-plane-intake" }
async-trait = "0.1"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
uuid = { version = "1", features = ["v4"] }
sekai-client = { git = "https://github.com/Sannrox/sekai-chisei.git", rev = "1b4584c8194b74d9cbf37ffefc30820942a4b61d", version = "0.1.1" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
