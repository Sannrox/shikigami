[package]
name = "shikigami-governance-sekai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "sekai-chisei governance adapter for shikigami."

[dependencies]
shikigami-engine = { path = "../shikigami-engine", default-features = false }
shikigami-plane-intake = { path = "../shikigami-plane-intake" }
async-trait = "0.1"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
uuid = { version = "1", features = ["v4"] }
sekai-client = { git = "https://github.com/Sannrox/sekai-chisei.git", rev = "084f5e7d20f942ea11be662090bbc52f46255713", version = "0.1.1" }

[dev-dependencies]
tempfile = "3"
tonic = { version = "0.14", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
