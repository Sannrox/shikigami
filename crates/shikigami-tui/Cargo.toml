[package]
name = "shikigami-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Interactive ACP client host for shikigami."

[dependencies]
shikigami-types = { path = "../shikigami-types" }
async-trait = "0.1"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm_0_28",
  "unstable-rendered-line-info",
] }
serde_json = "1"
shikigami = { path = "../..", default-features = false }
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
