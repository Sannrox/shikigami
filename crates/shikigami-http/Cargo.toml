[package]
name = "shikigami-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "OpenAI-compatible HTTP model adapter for shikigami."

[dependencies]
shikigami-engine = { path = "../shikigami-engine", default-features = false }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
