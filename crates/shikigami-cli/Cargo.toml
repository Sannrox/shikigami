[package]
name = "shikigami-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "CLI host for the shikigami agent harness."

[[bin]]
name = "shikigami"
path = "src/main.rs"

[features]
default = ["governance-sekai-chisei", "model-http"]
governance-sekai-chisei = ["shikigami/governance-sekai-chisei"]
model-http = ["shikigami/model-http"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shikigami = { path = "../..", default-features = false }
shikigami-tui = { path = "../shikigami-tui" }
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
